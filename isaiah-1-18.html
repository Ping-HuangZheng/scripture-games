<!DOCTYPE html>

<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1f2a37;--muted:#5b6675;--pri:#b3261e;--pri2:#8c1d17;--ok:#1e7a3c;--okbg:#e3f4e8;--bad:#b3261e;--badbg:#fde8e6;--line:#e3ddd0;--snow:#eef3f8}
*{box-sizing:border-box}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:0 2px 8px rgba(0,0,0,.04);margin-bottom:14px}

.btn{appearance:none;border:2px solid var(--pri);background:var(--pri);color:#fff;font:inherit;font-weight:700;border-radius:12px;min-height:52px;padding:10px 18px;cursor:pointer;touch-action:manipulation}

.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:60px}

<body>
<div class="wrap">

</div>
<script>
(function(){
"use strict";
var VERSE = "耶和華說：你們來，我們彼此辯論。你們的罪雖像硃紅，必變成雪白；雖紅如丹顏，必白如羊毛。";

function load(){ try{ var s=JSON.parse(localStorage.getItem(KEY)||"{}"); return {unlocked:s.unlocked||1, done:s.done||{}, best:s.best||null}; }catch(e){ return {unlocked:1,done:{},best:null}; } }

function el(tag, attrs, kids){

function header(title, sub){
  return el("div",{class:"topbar"},[
    el("button",{class:"btn ghost",text:"← 回選單",onclick:menu,"aria-label":"回到關卡選單"}),

function menu(){

    el("h2",{text:"今天要背的經文"}),

    el("p",{class:"hint",text:"—— "+REF})

    var b=el("button",{class:"lv"+(locked?" locked":"")+(done?" done":""),"data-level":String(L.n),"aria-disabled":locked?"true":"false"},[
      el("span",{class:"n",text:locked?"🔒":(done?"✓":String(L.n))}),

    list.appendChild(b);
  });
  app.appendChild(el("section",{class:"card"},[el("h2",{text:"五個關卡"}),el("p",{class:"hint",text:"依序過關就能解鎖下一關。"}),list]));
  var extra=el("div",{class:"row"});
  if(state.done[5]) extra.appendChild(el("button",{class:"btn",text:"看完整經文",onclick:finalScreen}));
  extra.appendChild(el("button",{class:"btn ghost",text:"重設進度",onclick:function(){ if(confirm("確定要清除這台裝置上的進度與最佳分數嗎？")){ state={unlocked:1,done:{},best:null}; save(); menu(); } }}));
  app.appendChild(extra);

function startLevel(n){ [null,level1,level2,level3,level4,level5][n](); }

function passLevel(n, msg){
  state.done[n]=true; if(state.unlocked<n+1) state.unlocked=Math.min(5,n+1); save();
  clear();
  var kids=[el("p",{class:"big",text:"🎉"}),el("h2",{text:"第"+n+"關 過關！"}),el("p",{text:msg||"做得好！"}),el("p",{class:"verse",text:VERSE}),el("p",{class:"hint",text:"—— "+REF})];

/* 第1關 排序 */
function level1(){
  clear();
  var next=0, miss=0;
  var zone=el("div",{class:"zone",id:"zone","aria-label":"答案區"});
  var fb=el("p",{class:"fb","aria-live":"polite"});
  var pool=el("div",{class:"chips",id:"pool"});
  var order=shuffledNotIdentity(CHUNKS.map(function(_,i){return i;}));

      btn.classList.add("used"); zone.appendChild(el("span",{class:"placed",text:CHUNKS[i]})); next++;
      feedback(fb,true,praise());
      if(next===CHUNKS.length) setTimeout(function(){ passLevel(1,"排序完成！錯了 "+miss+" 次。"); },500);
    } else {
      miss++; btn.classList.remove("bad"); void btn.offsetWidth; btn.classList.add("bad");

    }
  }
  order.forEach(function(i){
    var b=el("button",{class:"chip","data-i":String(i),draggable:"true",text:CHUNKS[i]});
    b.addEventListener("click",function(){ attempt(b); });
    b.addEventListener("dragstart",function(e){ e.dataTransfer.setData("text/plain",String(i)); });
    pool.appendChild(b);
  });
  zone.addEventListener("dragover",function(e){ e.preventDefault(); zone.classList.add("over"); });
  zone.addEventListener("dragleave",function(){ zone.classList.remove("over"); });
  zone.addEventListener("drop",function(e){ e.preventDefault(); zone.classList.remove("over"); var i=e.dataTransfer.getData("text/plain"); var b=pool.querySelector('[data-i="'+i+'"]'); if(b) attempt(b); });

}

/* 第2關 填空 */
function level2(){
  var ROUNDS=[2,4,6]; var r=0, miss=0;
  function round(){
    clear();
    var hidden=sample(CHUNKS.map(function(_,i){return i;}),ROUNDS[r]).sort(function(a,b){return a-b;});
    var cur=0;
    var verse=el("p",{class:"verse",id:"fillVerse"});
    var spans={};
    CHUNKS.forEach(function(c,i){
      if(hidden.indexOf(i)>=0){ var core=c.replace(PUNCT,""); var s=el("span",{class:"blank","data-i":String(i),text:"＿".repeat(core.length)}); spans[i]=s; verse.appendChild(s); verse.appendChild(document.createTextNode(c.slice(core.length))); }

      Object.keys(spans).forEach(function(k){ spans[k].classList.toggle("active", +k===hidden[cur]); });

      choicesFor(target,4).forEach(function(i){
        var core=CHUNKS[i].replace(PUNCT,"");
        var b=el("button",{class:"chip","data-i":String(i),text:core});
        b.addEventListener("click",function(){
          if(i===target){ var s=spans[target]; s.textContent=core; s.className="blank filled"; feedback(fb,true,praise()); cur++;
            if(cur===hidden.length){ opts.innerHTML=""; r++; setTimeout(function(){ if(r<ROUNDS.length) round(); else passLevel(2,"三輪填空全部完成！錯了 "+miss+" 次。"); },600); }
            else show();
          } else { miss++; b.classList.add("bad"); b.disabled=true; feedback(fb,false,"❌ 再想想，這一格是「"+CHUNKS[target].charAt(0)+"…」開頭"); }
        });

/* 第3關 首字提示 */
function level3(){
  clear();
  var cur=0, miss=0;
  var verse=el("p",{class:"verse",id:"hintVerse"});
  var spans=CHUNKS.map(function(c,i){ var s=el("span",{"data-i":String(i),text:firstHint(c)}); verse.appendChild(s); return s; });

      var b=el("button",{class:"chip","data-i":String(i),text:CHUNKS[i].replace(PUNCT,"")});
      b.addEventListener("click",function(){

    if(a===want){ feedback(fb2,true,"✅ 一字不差！"); done(); }

    el("details",null,[el("summary",{text:"改用打字作答"}),ta,el("div",{class:"row",style:"margin-top:10px"},[chk]),fb2])]));

/* 第4關 出處配對 */

  shuffle([REF].concat(sample(REF_DISTRACT,3))).forEach(function(r){

/* 第5關 計時挑戰 */
function level5(){

  var qs=[], i;

  var types=shuffle(["next","next","next","fill","fill","fill","hint","hint","ref","ref"]);
  types.forEach(function(t){
    if(t==="next"){ var k=Math.floor(Math.random()*(CHUNKS.length-1)); qs.push({type:"接下一句",prompt:"「"+CHUNKS[k]+"」的下一段是？",ans:CHUNKS[k+1].replace(PUNCT,""),opts:choicesFor(k+1,4).map(function(j){return CHUNKS[j].replace(PUNCT,"");})}); }
    else if(t==="fill"){ var k2=Math.floor(Math.random()*CHUNKS.length); var core=CHUNKS[k2].replace(PUNCT,""); var p=CHUNKS.map(function(c,j){ return j===k2? "（　　）"+c.slice(core.length) : c; }).join(""); qs.push({type:"填空",prompt:p,ans:core,opts:choicesFor(k2,4).map(function(j){return CHUNKS[j].replace(PUNCT,"");})}); }

  });

  var idx=0, correct=0, answered=0, t0=Date.now(), timerId=null, over=false;
  var timer=el("span",{class:"pill timer",id:"timer",text:LIMIT+" 秒"});
  var prog=el("span",{class:"pill",id:"prog"});
  var typ=el("p",{class:"hint"}); var prompt=el("p",{class:"verse",id:"q5"}); var opts=el("div",{class:"opts",id:"opts5"}); var fb=el("p",{class:"fb","aria-live":"polite"});
  var bar=el("div",{class:"topbar"},[el("button",{class:"btn ghost",text:"← 回選單",onclick:function(){ clearInterval(timerId); menu(); }}),prog,timer]);
  app.appendChild(el("section",{class:"card"},[bar,el("h2",{text:"第5關　計時挑戰"}),typ,prompt,opts,fb]));

  timerId=setInterval(function(){ var l=left(); timer.textContent=l+" 秒"; timer.classList.toggle("low",l<=15); if(l<=0) finish(true); },250);
  function show(){
    var q=qs[idx]; prog.textContent="第 "+(idx+1)+" / "+TOTAL+" 題　答對 "+correct; typ.textContent="題型："+q.type; prompt.textContent=q.prompt; opts.innerHTML="";
    q.opts.forEach(function(o){
      var b=el("button",{class:"chip",text:o,"data-ans":o===q.ans?"1":"0"});
      b.addEventListener("click",function(){
        if(over) return; answered++;
        opts.querySelectorAll("button").forEach(function(x){ x.disabled=true; if(x.getAttribute("data-ans")==="1") x.classList.add("ok"); });
        if(o===q.ans){ correct++; feedback(fb,true,praise()); } else { b.classList.add("bad"); feedback(fb,false,"❌ 正確答案是「"+q.ans+"」"); }
        setTimeout(function(){ idx++; if(idx>=TOTAL) finish(false); else { if(!over){ fb.textContent=""; show(); } } }, o===q.ans?450:1100);
      });
      opts.appendChild(b);
    });
  }
  function finish(timeout){
    if(over) return; over=true; clearInterval(timerId);
    var used=Math.min(LIMIT, Math.round((Date.now()-t0)/1000));
    var acc= answered? Math.round(correct/TOTAL*100) : 0;
    var score= correct*100 + (timeout?0:Math.max(0,LIMIT-used)*5);
    var newBest=false;
    if(!state.best || score>state.best.score){ state.best={score:score,acc:acc,time:used}; newBest=true; }
    var passed = acc>=70;
    if(passed){ state.done[5]=true; }
    save();
    clear();
    var kids=[el("p",{class:"big",text:passed?"🏆":"⏱️"}),el("h2",{text:timeout?"時間到！":(passed?"挑戰完成！":"差一點點！")}),
      el("div",{class:"stats"},[el("div",null,[el("b",{id:"score",text:String(score)}),"分數"]),el("div",null,[el("b",{id:"acc",text:acc+"%"}),"正確率"]),el("div",null,[el("b",{text:used+" 秒"}),"用時"])]),
      el("p",{text:"答對 "+correct+" / "+TOTAL+" 題"+(newBest?"　🎖️ 新紀錄！":"")+"　最佳分數："+state.best.score}),
      el("p",{class:"hint",text:passed?"正確率 70% 以上就算過關。":"正確率要 70% 以上才算過關，再挑戰一次吧！"})];
    var row=el("div",{class:"row"});
    if(passed) row.appendChild(el("button",{class:"btn",id:"toFinal",text:"看完整經文",onclick:finalScreen}));
    row.appendChild(el("button",{class:"btn ghost",id:"replay5",text:"再挑戰一次",onclick:level5}));
    row.appendChild(el("button",{class:"btn ghost",text:"回選單",onclick:menu}));
    kids.push(row);
    app.appendChild(el("section",{class:"card final",id:"result5"},kids));
  }
  show();
}

function finalScreen(){
  clear();
  app.appendChild(el("section",{class:"card final",id:"finalCard"},[
    el("p",{class:"big",text:"🕊️"}),el("h2",{text:"恭喜！五關全部完成"}),
    el("p",{class:"verse",id:"finalVerse",text:VERSE}),
    el("p",{id:"finalRef",style:"font-weight:700;font-size:1.15rem",text:"—— "+REF}),
    state.best? el("p",{class:"hint",text:"計時挑戰最佳分數："+state.best.score+" 分（正確率 "+state.best.acc+"%）"}) : null,
    el("div",{class:"row"},[el("button",{class:"btn",text:"回選單",onclick:menu}),el("button",{class:"btn ghost",text:"再挑戰計時關",onclick:level5})])
  ]));
}

menu();
})();
</script>
</body>
</html>
